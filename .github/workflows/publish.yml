# Publishes a release to npm and to the official MCP Registry:
#  - on a push to main whose package.json version has no v<version> tag yet
#    (merging a version bump releases it; other pushes to main do nothing),
#  - on a pushed version tag (v1.2.3),
#  - or when run by hand from the Actions tab (workflow_dispatch on main).
# Runs from main create the v<version> tag after publishing. Both npm and the MCP
# Registry are authenticated with GitHub OIDC: npm through Trusted publishing
# (https://docs.npmjs.com/trusted-publishers), the registry as in
# https://modelcontextprotocol.io/registry/github-actions.md. No long-lived tokens.
# If the version is already on npm (e.g. a staged version approved by hand), the
# npm step is skipped and the run continues with the registry and the tag.
name: Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm Trusted publishing, provenance and MCP Registry OIDC login
      contents: write # create the version tag on manual runs
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v5

      - name: Version to publish
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            if [ "${GITHUB_REF_NAME}" != "main" ]; then echo "Publishes from main only"; exit 1; fi
            V="$(node -p 'require("./package.json").version')"
            echo "version=$V" >> "$GITHUB_OUTPUT"
            if git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null; then
              echo "v$V is already released; nothing to publish."
              echo "publish=false" >> "$GITHUB_OUTPUT"
            else
              echo "publish=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - uses: actions/setup-node@v5
        if: steps.ver.outputs.publish == 'true'
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"

      - name: npm CLI with Trusted publishing support (11.5.1 or later)
        if: steps.ver.outputs.publish == 'true'
        run: npm install -g npm@11 && npm --version

      - if: steps.ver.outputs.publish == 'true'
        run: npm ci
      - if: steps.ver.outputs.publish == 'true'
        run: npm test
      - if: steps.ver.outputs.publish == 'true'
        run: npm run build

      - name: Version matches package.json, server.json, plugin.json, mcp.json and version.ts
        if: steps.ver.outputs.publish == 'true'
        run: node scripts/check-versions.mjs "${{ steps.ver.outputs.version }}"

      - name: Is this version already on npm?
        id: npm
        if: steps.ver.outputs.publish == 'true'
        run: |
          V="${{ steps.ver.outputs.version }}"
          if [ "$(npm view "x402-security-check-mcp@$V" version 2>/dev/null)" = "$V" ]; then
            echo "x402-security-check-mcp@$V is already on npm; skipping npm publish."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package to npm (Trusted publishing)
        if: steps.ver.outputs.publish == 'true' && steps.npm.outputs.exists != 'true'
        run: npm publish --access public --provenance

      - name: Install cosign
        if: steps.ver.outputs.publish == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        if: steps.ver.outputs.publish == 'true'
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Authenticate to MCP Registry
        if: steps.ver.outputs.publish == 'true'
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        if: steps.ver.outputs.publish == 'true'
        run: ./mcp-publisher publish

      - name: Create the version tag (runs from main)
        if: steps.ver.outputs.publish == 'true' && github.ref_type != 'tag'
        run: |
          git tag "v${{ steps.ver.outputs.version }}" "$GITHUB_SHA"
          git push origin "v${{ steps.ver.outputs.version }}"
